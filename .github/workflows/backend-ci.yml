name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "models/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "models/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRGAP: "true"
      HARDWARE_TIER: min
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap backend dependencies
        run: ./scripts/bootstrap.sh --skip-frontend
      - name: Install local OCR tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils fonts-dejavu-core
      - name: Backend lint
        run: make backend-lint
      - name: Backend tests
        working-directory: backend
        run: ../.venv/bin/pytest --cov=sovereign_workbench.core --cov-report=term-missing --cov-fail-under=70
      - name: Provision sandbox image before offline execution test
        run: docker pull python:3.12-slim
      - name: Verify Docker sandbox isolation
        working-directory: backend
        env:
          SW_TEST_DOCKER: "1"
        run: ../.venv/bin/pytest tests/test_docker_sandbox.py
