name: Docker

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "models/**"
      - "scripts/Dockerfile.backend"
      - "scripts/Dockerfile.backend.dockerignore"
      - "docker-compose*.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "models/**"
      - "scripts/Dockerfile.backend"
      - "scripts/Dockerfile.backend.dockerignore"
      - "docker-compose*.yml"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate CPU Compose configuration
        run: docker compose config --quiet
      - name: Validate GPU Compose override
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: Build images
        run: docker compose build
      - name: Start local smoke stack
        run: docker compose up -d --wait ollama backend frontend
      - name: Check backend API
        run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8000/api/health
      - name: Check frontend
        run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:5173/
      - name: Stop stack
        if: always()
        run: docker compose down -v
