name: Licence checks

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/bootstrap.sh"
      - ".github/workflows/license-check.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/pyproject.toml"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "scripts/bootstrap.sh"
      - ".github/workflows/license-check.yml"

permissions:
  contents: read

jobs:
  licences:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies and licence scanner
        run: |
          ./scripts/bootstrap.sh --skip-frontend
          .venv/bin/python -m pip install pip-licenses
      - name: Check Python licences
        run: >-
          .venv/bin/pip-licenses
          --ignore-packages certifi pathspec
          --allow-only="MIT;MIT License;MIT-CMU;Apache-2.0;Apache Software License;BSD License;BSD-2-Clause;BSD-3-Clause;Apache-2.0 OR BSD-2-Clause;ISC;PSF-2.0;0BSD;Unlicense"
      - name: Check documented file-scoped licence exceptions
        run: >-
          .venv/bin/pip-licenses --packages certifi pathspec
          --allow-only="Mozilla Public License 2.0 (MPL 2.0);MPL-2.0"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check frontend licences
        working-directory: frontend
        run: npx --yes license-checker@25.0.1 --production --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense;CC0-1.0;Zlib"
