# ------------------------------- remote fallback (OFF in air-gap) -----------
[[model]]
id = "openai-gpt"
provider = "openai"
remote = true
tier = "remote"
capabilities = ["plan", "chat", "code", "vision"]
model_name = "gpt-4o-mini"
context = 128000
tags = ["cloud"]
notes = "Optional cloud fallback. Disabled while AIRGAP=true."

[[model]]
id = "openrouter-any"
provider = "openrouter"
remote = true
tier = "remote"
capabilities = ["plan", "chat", "code"]
model_name = "qwen/qwen-2.5-72b-instruct"
context = 32000
tags = ["cloud"]
notes = "Optional OpenRouter fallback. Disabled while AIRGAP=true."
