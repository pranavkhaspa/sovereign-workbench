# Sovereign Workbench — model registry
# Add a model by adding a [[model]] block. The router selects by capability + tier.
# Docs: docs/MODELS.md
#
# Fields:
#   id           unique id used in configs and the audit log
#   provider     ollama | llamacpp | openai | openrouter | anthropic | gemini
#   remote       true => disabled automatically when AIRGAP=true
#   tier         min | standard | large | remote
#   capabilities subset of: plan, chat, code, vision, embed
#   context      approximate context window (tokens)
#   tags         freeform hints: "fast", "creative", "reasoning"
#   notes        human note shown in the Models panel

# ------------------------------- minimum tier (8 GB / 2 GB GPU) -------------
[[model]]
id = "planner-min"
provider = "ollama"
remote = false
tier = "min"
capabilities = ["plan", "chat"]
model_name = "qwen2.5:1.5b-instruct-q4_K_M"
context = 8192
tags = ["reasoning"]
notes = "Default planner/chat on the small machine."

[[model]]
id = "coder-min"
provider = "ollama"
remote = false
tier = "min"
capabilities = ["code", "chat"]
model_name = "qwen2.5-coder:1.5b-instruct-q4_K_M"
context = 8192
tags = ["code"]
notes = "Code generation and repair on the small machine."

[[model]]
id = "utility-min"
provider = "ollama"
remote = false
tier = "min"
capabilities = ["chat"]
model_name = "qwen2.5:1.5b-instruct-q4_K_M"
context = 8192
tags = ["fast", "classification"]
notes = "Fast utility model for classification and short answers."

[[model]]
id = "vision-min"
provider = "ollama"
remote = false
tier = "min"
capabilities = ["vision"]
model_name = "moondream2"
context = 2048
tags = ["vision"]
notes = "Reads scanned documents, drawings and photos on small GPUs."

[[model]]
id = "embed-min"
provider = "local"          # sentence-transformers on CPU, no server needed
remote = false
tier = "min"
capabilities = ["embed"]
model_name = "BAAI/bge-small-en-v1.5"
context = 512
tags = ["embeddings"]
notes = "CPU embedding model for the local knowledge base."

