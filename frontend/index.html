<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sovereign Workbench</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied before first paint so the light theme never flashes dark.
      try {
        if (localStorage.getItem("swb-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (error) {
        /* storage unavailable */
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
