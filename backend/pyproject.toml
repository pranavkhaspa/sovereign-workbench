[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-workbench"
version = "0.1.0"
description = "Self-hosted, air-gapped agentic AI workbench using open-weight LLMs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Sovereign Workbench contributors" }]
keywords = ["ai", "agents", "rag", "on-premise", "air-gapped", "open-weight", "sih"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
  "xlsxwriter>=3.2",
]

[project.optional-dependencies]
rag = [
  "sentence-transformers>=3.0",
  "pypdf>=4.2",
]
ocr = [
  "pytesseract>=0.3.10",
  "pillow>=10.3",
  "pypdf>=4.2",
  "pdf2image>=1.17",
]
all = [
  "sovereign-workbench[rag,ocr]",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "black>=24.4",
  "mypy>=1.10",
  "types-python-dateutil",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_workbench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends in defaults

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sovereign_workbench.core.*"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sovereign_workbench"]
branch = true
